<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval Timer</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .timer-card { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h1 { margin-bottom: 24px; font-size: 24px; color: #111; }
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        label { font-weight: 600; font-size: 16px; }
        input { width: 80px; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
        .display { margin: 30px 0; padding: 20px; border-radius: 12px; background: #f8f9fa; }
        #status { font-size: 20px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        #time-left { font-size: 48px; font-weight: bold; font-variant-numeric: tabular-nums; }
        #rep-counts { font-size: 18px; margin-top: 8px; color: #666; }
        button { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .btn-start { background-color: #007aff; color: white; }
        .btn-stop { background-color: #ff3b30; color: white; }
    </style>
</head>
<body>
<div class="timer-card">
    <h1>Interval Timer</h1>
    <div class="input-group"><label for="reps">Reps:</label><input type="number" id="reps" value="15" min="1"></div>
    <div class="input-group"><label for="duration">Duration (s):</label><input type="number" id="duration" value="5" min="1"></div>
    <div class="input-group"><label for="pause">Pause (s):</label><input type="number" id="pause" value="3" min="0"></div>
    <div class="display">
        <div id="status">Ready</div>
        <div id="time-left">0</div>
        <div id="rep-counts">Rep 0 / 0</div>
    </div>
    <button id="action-btn" class="btn-start" onclick="toggleTimer()">Start</button>
</div>
<script>
    let timerInterval = null, audioCtx = null, isRunning = false;
    let currentRep = 1, totalReps = 15, durationTime = 5, pauseTime = 3, phase = 'work', secondsLeft = 0;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playBeep(frequency, duration) { 
        initAudio(); 
        if (audioCtx.state === 'suspended') audioCtx.resume(); 
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); 
        osc.type = 'sine'; 
        osc.frequency.value = frequency; 
        gain.gain.setValueAtTime(1.0, audioCtx.currentTime); 
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); 
        osc.connect(gain); 
        gain.connect(audioCtx.destination); 
        osc.start(); 
        osc.stop(audioCtx.currentTime + duration); 
    }
    function toggleTimer() { initAudio(); if (isRunning) stopTimer(); else startTimer(); }
    function startTimer() { 
        totalReps = parseInt(document.getElementById('reps').value) || 15; 
        durationTime = parseInt(document.getElementById('duration').value) || 5; 
        pauseTime = parseInt(document.getElementById('pause').value) || 3; 
        currentRep = 1; phase = 'work'; secondsLeft = durationTime; isRunning = true; 
        const btn = document.getElementById('action-btn'); btn.textContent = 'Stop'; btn.className = 'btn-stop'; 
        updateDisplay(); playBeep(880, 0.4); timerInterval = setInterval(tick, 1000); 
    }
    function stopTimer() { 
        clearInterval(timerInterval); isRunning = false; 
        const btn = document.getElementById('action-btn'); btn.textContent = 'Start'; btn.className = 'btn-start'; 
        document.getElementById('status').textContent = 'Ready'; document.getElementById('time-left').textContent = '0'; 
        document.getElementById('rep-counts').textContent = 'Rep 0 / 0'; 
    }
    function tick() { 
        secondsLeft--; 
        if (secondsLeft <= 0) { 
            if (phase === 'work') { 
                if (currentRep >= totalReps) { playBeep(1200, 0.8); stopTimer(); document.getElementById('status').textContent = 'Finished!'; return; } 
                else { phase = 'pause'; secondsLeft = pauseTime; playBeep(440, 0.3); } 
            } else { currentRep++; phase = 'work'; secondsLeft = durationTime; playBeep(880, 0.4); } 
        } 
        updateDisplay(); 
    }
    function updateDisplay() { 
        const s = document.getElementById('status'), t = document.getElementById('time-left'), r = document.getElementById('rep-counts'); 
        if (phase === 'work') { s.textContent = 'Work'; s.style.color = '#007aff'; } 
        else { s.textContent = 'Pause'; s.style.color = '#ff9500'; } 
        t.textContent = secondsLeft; r.textContent = `Rep ${currentRep} / ${totalReps}`; 
    }
</script>
</body>
</html>
